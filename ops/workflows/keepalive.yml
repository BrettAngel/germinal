# Keeps the Supabase database active so the free tier doesn't pause it
# (free projects pause after 7 days with no database queries).
# Moved from forkflows/keepalive.yml, where GitHub never ran it: workflows must
# live in .github/workflows. Scheduled workflows run only from the default
# branch, so this starts once it is on main. No secrets: it calls our public API.
name: Keep Supabase awake

on:
  schedule:
    - cron: '0 9 * * 1,4'   # 09:00 UTC every Monday and Thursday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Germinal API (triggers a DB query)
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" "https://germinal.studio/api/display-live?theme=love" || true
