# Keeps the Supabase database active so the free tier doesn't pause it.
# Supabase pauses free projects after 7 consecutive days with NO database
# queries. This pings our own live endpoint (which queries the database)
# on a schedule, well inside that window. No secrets needed — it just calls
# our public API, which performs a harmless canvas lookup.
name: Keep Supabase awake

on:
  schedule:
    # 09:00 UTC every Monday and Thursday (twice weekly = safe buffer)
    - cron: '0 9 * * 1,4'
  workflow_dispatch:   # also allows manual run from the GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Germinal API (triggers a DB query)
        run: |
          echo "Pinging Germinal canvas-load endpoint to keep Supabase active…"
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" \
            "https://germinal.studio/api/canvas-load/keepalive" || true
          # A 404 "Canvas not found" is EXPECTED and is fine — it still
          # performed a database query, which is what resets the pause timer.
          echo "Done. (A 404 is expected and still counts as activity.)"
