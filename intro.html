<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Germinal — Introduction</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Courier+Prime&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--gold:#c8a96e;--bg:#06060f;--txt:#e8e0d0;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Cormorant Garamond',serif;}
#stage{position:fixed;inset:0;background:#000;}
#bgC{position:absolute;inset:0;width:100%;height:100%;display:block;}
#vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 42%,transparent 0%,rgba(6,6,15,.4) 55%,rgba(6,6,15,.92) 100%);}
/* Caption layer */
#caption{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:88%;max-width:680px;text-align:center;z-index:5;pointer-events:none;}
.cap-line{font-size:clamp(22px,4.2vw,40px);font-weight:300;color:var(--txt);
  line-height:1.4;opacity:0;transition:opacity 1.1s ease,transform 1.1s ease;
  transform:translateY(12px);text-shadow:0 2px 40px rgba(0,0,0,.8);}
.cap-line.show{opacity:1;transform:translateY(0);}
.cap-line em{font-style:italic;color:var(--gold);}
.cap-line.small{font-size:clamp(15px,2.6vw,22px);color:#a89878;}
.cap-line.huge{font-size:clamp(30px,6vw,62px);font-style:italic;}
/* Three scales */
#scales{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  display:flex;gap:clamp(16px,5vw,60px);z-index:5;opacity:0;transition:opacity 1s;pointer-events:none;}
#scales.show{opacity:1;}
.scale{text-align:center;opacity:0;transform:translateY(20px);
  transition:opacity .9s ease,transform .9s ease;}
.scale.show{opacity:1;transform:translateY(0);}
.scale-anim{width:clamp(90px,18vw,150px);height:clamp(90px,18vw,150px);
  margin:0 auto 16px;border-radius:50%;overflow:hidden;position:relative;
  background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.03),transparent 70%);
  box-shadow:0 0 40px rgba(0,0,0,.5),inset 0 0 30px rgba(0,0,0,.6);}
.scale-anim canvas{width:100%;height:100%;display:block;}
.scale-name{font-family:'Courier Prime',monospace;font-size:clamp(9px,1.6vw,12px);
  letter-spacing:.2em;text-transform:uppercase;color:var(--txt);display:block;margin-bottom:6px;}
.scale-desc{font-size:clamp(12px,2vw,16px);font-style:italic;color:#888;line-height:1.4;
  max-width:170px;margin:0 auto;}
/* Controls */
#controls{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:20px;z-index:20;}
.ctrl-btn{font-family:'Courier Prime',monospace;font-size:10px;letter-spacing:.18em;
  text-transform:uppercase;color:#888;background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.12);border-radius:40px;padding:13px 26px;
  cursor:pointer;transition:all .2s;text-decoration:none;touch-action:manipulation;}
.ctrl-btn:hover{color:var(--txt);border-color:rgba(255,255,255,.3);}
.ctrl-btn.primary{border-color:var(--gold);color:var(--gold);background:rgba(200,169,110,.08);}
#progress{position:fixed;bottom:0;left:0;height:2px;background:var(--gold);
  width:0%;z-index:20;transition:width .3s linear;opacity:.5;}
/* Start overlay (needed for audio autoplay policy) */
#startGate{position:fixed;inset:0;z-index:50;background:#000;display:flex;
  flex-direction:column;align-items:center;justify-content:center;cursor:pointer;
  transition:opacity 1s;}
#startGate.hide{opacity:0;pointer-events:none;}
.sg-name{font-size:clamp(50px,11vw,120px);font-weight:300;font-style:italic;
  color:#f0e8d8;letter-spacing:-.01em;margin-bottom:8px;}
.sg-sub{font-family:'Courier Prime',monospace;font-size:11px;letter-spacing:.4em;
  text-transform:uppercase;color:#666;margin-bottom:50px;}
.sg-play{display:flex;align-items:center;gap:14px;font-family:'Courier Prime',monospace;
  font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);
  border:1.5px solid var(--gold);border-radius:50px;padding:18px 38px;
  background:rgba(200,169,110,.06);transition:all .3s;}
#startGate:hover .sg-play{background:rgba(200,169,110,.16);}
.sg-play .tri{width:0;height:0;border-left:13px solid var(--gold);
  border-top:8px solid transparent;border-bottom:8px solid transparent;}
.sg-note{font-family:'Courier Prime',monospace;font-size:9px;letter-spacing:.15em;
  text-transform:uppercase;color:#444;margin-top:28px;}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bgC"></canvas>
  <div id="vignette"></div>
  <div id="caption"></div>
  <div id="scales">
    <div class="scale" id="scale0">
      <div class="scale-anim"><canvas id="animCell" width="200" height="200"></canvas></div>
      <span class="scale-name">Molecular</span>
      <span class="scale-desc">A B-cell divides and expands</span></div>
    <div class="scale" id="scale1">
      <div class="scale-anim"><canvas id="animLove" width="200" height="200"></canvas></div>
      <span class="scale-name">Human</span>
      <span class="scale-desc">Two meet, and a lineage grows</span></div>
    <div class="scale" id="scale2">
      <div class="scale-anim"><canvas id="animCanvas2" width="200" height="200"></canvas></div>
      <span class="scale-name">Cultural</span>
      <span class="scale-desc">This canvas, evolving</span></div>
  </div>
</div>

<div id="progress"></div>
<div id="controls" style="display:none;">
  <a href="app.html" class="ctrl-btn">Skip intro →</a>
</div>

<div id="startGate">
  <div class="sg-name">Germinal</div>
  <div class="sg-sub">germinal.studio</div>
  <div class="sg-play"><div class="tri"></div> Begin</div>
  <div class="sg-note">2 minutes · sound on · best with headphones</div>
</div>

<audio id="voice" preload="auto" src="intro-voice.m4a"></audio>

<script>
// ─── Pixel field background ───
const bgC=document.getElementById('bgC'),bgX=bgC.getContext('2d');
let BW,BH,bCols,bRows,bCells,CS=10;
const DARK=['#070710','#08080f','#0a0a14','#090912','#0b0b16','#060610','#0c0c18'];
const WARM=['#1a0e00','#2a1800','#3a2200','#4a2c00','#5a3600','#6a4200'];
const WARM_BRIGHT=['#ffdd44','#ffcc00','#ffaa00','#ff8800','#ff6600','#ffbb22'];
let warmInject=0; // 0..1 how much warm light is entering
let warmCenter={x:0.7,y:0.3};
let brightCore=0; // 0..1 intensity of the bright sun core

function rnd(a){return a[Math.floor(Math.random()*a.length)];}
function h2r(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function r2h(r,g,b){return'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');}
function lerp(a,b,t){return a+(b-a)*t;}
function lerpH(h1,h2,t){const[r1,g1,b1]=h2r(h1),[r2,g2,b2]=h2r(h2);return r2h(lerp(r1,r2,t),lerp(g1,g2,t),lerp(b1,b2,t));}

function initBg(){
  BW=window.innerWidth;BH=window.innerHeight;
  bgC.width=BW;bgC.height=BH;
  bCols=Math.ceil(BW/CS);bRows=Math.ceil(BH/CS);
  bCells=Array.from({length:bCols*bRows},()=>({c:rnd(DARK)}));
}
function stepBg(){
  for(let i=0;i<bCols*bRows;i++){
    const col=i%bCols,row=Math.floor(i/bCols);
    const u=col/bCols,v=row/bRows;
    // Distance to warm center
    const dx=u-warmCenter.x,dy=v-warmCenter.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(Math.random()>.06)continue;
    // Base drift
    const nb=[];
    for(let dy2=-1;dy2<=1;dy2++)for(let dx2=-1;dx2<=1;dx2++){
      if(!dx2&&!dy2)continue;const nx=col+dx2,ny=row+dy2;
      if(nx>=0&&nx<bCols&&ny>=0&&ny<bRows)nb.push(bCells[ny*bCols+nx].c);
    }
    let target;
    // Warm injection near center
    const warmHere=warmInject*Math.max(0,1-dist/0.42);
    if(Math.random()<warmHere){
      // Bright core in the very center when brightCore is high
      if(dist<0.12&&Math.random()<brightCore){
        target=rnd(WARM_BRIGHT);
      } else if(dist<0.28&&Math.random()<warmInject){
        target=Math.random()<0.5?rnd(WARM_BRIGHT):rnd(WARM);
      } else {
        target=rnd(WARM);
      }
    } else if(nb.length&&Math.random()<.6){
      target=rnd(nb);
    } else {
      target=rnd(DARK);
    }
    bCells[i].c=lerpH(bCells[i].c,target,.3);
  }
}
function drawBg(){
  const img=bgX.createImageData(BW,BH);const d=img.data;
  for(let i=0;i<bCols*bRows;i++){
    const[r,g,b]=h2r(bCells[i].c);
    const col=i%bCols,row=Math.floor(i/bCols),bx=col*CS,by=row*CS;
    for(let cy=0;cy<CS;cy++){const yy=by+cy;if(yy>=BH)break;
      for(let cx=0;cx<CS;cx++){const xx=bx+cx;if(xx>=BW)break;
        const pi=(yy*BW+xx)*4;d[pi]=r;d[pi+1]=g;d[pi+2]=b;d[pi+3]=255;}}
  }
  bgX.putImageData(img,0,0);
}
let bf=0;
function loop(){if(bf%3===0){stepBg();drawBg();}bf++;requestAnimationFrame(loop);}
window.addEventListener('resize',()=>{clearTimeout(window._r);window._r=setTimeout(initBg,200);});
initBg();drawBg();loop();

// ─── Caption timeline ───
// Timed to the voiceover. Times in seconds, matched to natural pauses
// detected in the audio (major breaks ~10s, 34s, 51s, 80s, 110s).
const cap=document.getElementById('caption');
function setCaption(html,cls){
  cap.innerHTML='<div class="cap-line '+(cls||'')+'">'+html+'</div>';
  requestAnimationFrame(()=>{
    const el=cap.querySelector('.cap-line');
    requestAnimationFrame(()=>el.classList.add('show'));
  });
}
function clearCaption(){
  const el=cap.querySelector('.cap-line');
  if(el)el.classList.remove('show');
}

// Timeline cues — [time, action]
const timeline=[
  [0.0, ()=>{ setCaption('In the beginning,<br><em>darkness.</em>'); warmInject=0; brightCore=0; }],
  [6.0, ()=>{ setCaption('No meaning, no form —<br>just noise.','small'); }],
  [10.5,()=>{ setCaption('Then something<br><em>noticed</em> something.'); warmInject=0.3; }],
  [16.0,()=>{ setCaption('A tiny act of recognition<br>in the void.','small'); warmInject=0.55; }],
  [22.0,()=>{ clearCaption(); warmInject=0.8; brightCore=0.6; droneShimmer(0.05,2); }],
  [24.0,()=>{ setCaption('Let there be <em>light.</em>','huge'); warmInject=1; brightCore=1; droneLevel(0.16,2); droneShimmer(0.09,2); }],
  [31.0,()=>{ droneShimmer(0.0,4); droneLevel(0.10,4); }],
  [34.5,()=>{ setCaption('You have already<br><em>done this.</em>'); brightCore=0.7; }],
  [41.0,()=>{ setCaption('Every time you chose a partner<br>for their way of seeing the world…','small'); }],
  [51.5,()=>{ setCaption('…you were running a process<br>your body has run for <em>millions of years.</em>','small'); }],
  [60.0,()=>{ clearCaption(); showScales(); droneLevel(0.08,3); }],
  [80.5,()=>{ hideScales(); setCaption('One mechanism.<br><em>Three scales.</em>'); droneLevel(0.12,3); }],
  [87.0,()=>{ setCaption('This canvas begins in darkness.<br>Then <em>you</em> arrive.','small'); warmCenter={x:0.5,y:0.45}; }],
  [96.0,()=>{ setCaption('Lasso what feels true.<br>What strangers preserve, generations later —','small'); }],
  [103.0,()=>{ setCaption('— that has genuine<br><em>resonance.</em>'); }],
  [109.5,()=>{ clearCaption(); warmInject=1; brightCore=1; warmCenter={x:0.5,y:0.42}; droneShimmer(0.08,3); droneLevel(0.18,3); }],
  [110.5,()=>{ setCaption('Enter the<br><em>germinal centre.</em>','huge'); showBegin(); }],
];

const scalesEl=document.getElementById('scales');
let scaleAnimRAF=null;

function showScales(){
  scalesEl.classList.add('show');
  [0,1,2].forEach((n,idx)=>setTimeout(()=>document.getElementById('scale'+n).classList.add('show'),idx*2600));
  startScaleAnims();
}
function hideScales(){
  scalesEl.classList.remove('show');
  [0,1,2].forEach(n=>document.getElementById('scale'+n).classList.remove('show'));
  // let fade finish, then stop the loops to save cpu
  setTimeout(stopScaleAnims,1200);
}

// ─────────────────────────────────────────────────────────────
// GENERATIVE SCALE ANIMATIONS
// Three small looping animations, drawn in Germinal's pixel idiom.
// 1) A B-cell dividing and the clonal population expanding outward.
// 2) Two forms meeting, merging, and producing a branching lineage.
// 3) A miniature of the canvas itself — pixels selecting and stabilising.
// ─────────────────────────────────────────────────────────────
const cellCtx=document.getElementById('animCell').getContext('2d');
const loveCtx=document.getElementById('animLove').getContext('2d');
const can2Ctx=document.getElementById('animCanvas2').getContext('2d');
const AS=200; // animation canvas size

// ── 1. B-CELL DIVISION & CLONAL EXPANSION ──
let cellPop=[];
let cellT=0;
function resetCells(){
  cellPop=[{x:AS/2,y:AS/2,r:18,age:0,hue:28,vx:0,vy:0}];
  cellT=0;
}
function drawCellScene(){
  cellT++;
  // dark backdrop with faint warm wash
  cellCtx.fillStyle='rgba(8,6,10,0.35)';
  cellCtx.fillRect(0,0,AS,AS);

  // Division: every ~70 frames, each cell may split, up to a cap
  if(cellT%70===0 && cellPop.length<26){
    const newborns=[];
    for(const c of cellPop){
      if(Math.random()<0.7){
        const ang=Math.random()*Math.PI*2;
        const push=c.r*0.9;
        c.vx-=Math.cos(ang)*0.4; c.vy-=Math.sin(ang)*0.4;
        newborns.push({x:c.x+Math.cos(ang)*push,y:c.y+Math.sin(ang)*push,
          r:Math.max(7,c.r*0.82),age:0,hue:c.hue+(Math.random()*16-8),
          vx:Math.cos(ang)*0.5,vy:Math.sin(ang)*0.5});
      }
    }
    cellPop=cellPop.concat(newborns);
  }

  // physics: gentle repulsion so the colony spreads like a real population
  for(let i=0;i<cellPop.length;i++){
    const a=cellPop[i];
    for(let j=i+1;j<cellPop.length;j++){
      const b=cellPop[j];
      let dx=b.x-a.x, dy=b.y-a.y;
      let d=Math.hypot(dx,dy)||0.01;
      const min=(a.r+b.r)*0.85;
      if(d<min){
        const f=(min-d)/min*0.5;
        dx/=d; dy/=d;
        a.vx-=dx*f; a.vy-=dy*f; b.vx+=dx*f; b.vy+=dy*f;
      }
    }
    // weak pull to center so it stays framed
    a.vx+=(AS/2-a.x)*0.0008; a.vy+=(AS/2-a.y)*0.0008;
  }

  for(const c of cellPop){
    c.x+=c.vx; c.y+=c.vy; c.vx*=0.9; c.vy*=0.9; c.age++;
    // membrane — pixel-grain ring
    const steps=Math.max(10,Math.floor(c.r*1.6));
    for(let s=0;s<steps;s++){
      const ang=(s/steps)*Math.PI*2;
      const wobble=1+Math.sin(ang*3+cellT*0.04+c.x)*0.06;
      const px=c.x+Math.cos(ang)*c.r*wobble;
      const py=c.y+Math.sin(ang)*c.r*wobble;
      const light=55+Math.sin(ang*2+cellT*0.05)*12;
      cellCtx.fillStyle=`hsl(${c.hue},85%,${light}%)`;
      cellCtx.fillRect(px-1.5,py-1.5,3,3);
    }
    // nucleus
    const ng=cellCtx.createRadialGradient(c.x,c.y,0,c.x,c.y,c.r*0.6);
    ng.addColorStop(0,`hsla(${c.hue+10},90%,65%,0.5)`);
    ng.addColorStop(1,'hsla(20,80%,30%,0)');
    cellCtx.fillStyle=ng;
    cellCtx.beginPath();cellCtx.arc(c.x,c.y,c.r*0.6,0,Math.PI*2);cellCtx.fill();
  }

  // when population fills, reset to begin the cycle again
  if(cellPop.length>=26 && cellT%70===0) setTimeout(resetCells,400);
}

// ── 2. HUMAN — MEETING, MERGING, LINEAGE ──
// Two silhouette-forms approach from opposite sides, meet center,
// then small offspring forms branch downward — a growing family tree.
let loveT=0;
let lineage=[];
function resetLove(){ loveT=0; lineage=[]; }
function pixelFigure(ctx,x,y,scale,hue,alpha){
  // a minimal stop-motion-style standing figure, drawn in pixel blocks
  ctx.fillStyle=`hsla(${hue},45%,72%,${alpha})`;
  const b=Math.max(2,scale*0.9); // block size
  // head
  ctx.fillRect(x-b, y-scale*6, b*2, b*2);
  // body
  ctx.fillRect(x-b, y-scale*4, b*2, scale*4);
  // arms
  ctx.fillRect(x-b*2.2, y-scale*3.4, b*1.2, b*1.1);
  ctx.fillRect(x+b*1.0, y-scale*3.4, b*1.2, b*1.1);
  // legs
  ctx.fillRect(x-b, y, b*0.8, scale*2.6);
  ctx.fillRect(x+b*0.2, y, b*0.8, scale*2.6);
}
function drawLoveScene(){
  loveT++;
  loveCtx.fillStyle='rgba(8,6,10,0.35)';
  loveCtx.fillRect(0,0,AS,AS);

  const cycle=loveT%520;
  const cx=AS/2;
  const topY=70;

  if(cycle<150){
    // two approach from sides
    const t=cycle/150;
    const lx=20+(cx-30-20)*t;
    const rx=AS-20-(cx-30-20)*t;
    pixelFigure(loveCtx,lx,topY,3,200,0.9);   // cool-hued figure
    pixelFigure(loveCtx,rx,topY,3,340,0.9);   // warm-hued figure
  } else if(cycle<210){
    // merge — overlap, a warm glow blooms
    const t=(cycle-150)/60;
    const glow=loveCtx.createRadialGradient(cx,topY-8,0,cx,topY-8,40*t+8);
    glow.addColorStop(0,`hsla(40,90%,65%,${0.5*t})`);
    glow.addColorStop(1,'hsla(40,90%,65%,0)');
    loveCtx.fillStyle=glow;loveCtx.fillRect(0,0,AS,AS);
    pixelFigure(loveCtx,cx-6,topY,3,200,0.9);
    pixelFigure(loveCtx,cx+6,topY,3,340,0.9);
    if(lineage.length===0&&t>0.5){
      // spawn first generation of children
      lineage=[{gen:1,n:2},{gen:2,n:3}];
    }
  } else {
    // lineage grows downward — generations branch
    pixelFigure(loveCtx,cx-6,topY,2.6,200,0.7);
    pixelFigure(loveCtx,cx+6,topY,2.6,340,0.7);
    const reveal=Math.min(1,(cycle-210)/200);
    // draw connecting lines + descendants
    let gens=[[cx]];
    const rowH=38;
    for(let g=1;g<=2;g++){
      const count=g+1;
      const row=[];
      const spread=40*g;
      for(let k=0;k<count;k++){
        const x=cx-spread/2+(spread/(count-1||1))*k;
        row.push(x);
      }
      gens.push(row);
    }
    if(reveal>0.15){
      for(let g=1;g<gens.length;g++){
        const y=topY+rowH*g;
        const parentRow=gens[g-1], thisRow=gens[g];
        const rr=Math.min(1,(reveal-0.15*g)*2);
        if(rr<=0)continue;
        for(let k=0;k<thisRow.length;k++){
          const px=thisRow[k];
          // connector
          const parent=parentRow[Math.min(parentRow.length-1,Math.floor(k/2))];
          loveCtx.strokeStyle=`hsla(40,40%,60%,${0.25*rr})`;
          loveCtx.lineWidth=1.5;
          loveCtx.beginPath();loveCtx.moveTo(parent,topY+rowH*(g-1)+6);
          loveCtx.lineTo(px,y-6);loveCtx.stroke();
          // small figure
          pixelFigure(loveCtx,px,y,1.7-g*0.25,40+k*20,0.55*rr+0.2);
        }
      }
    }
  }
  if(cycle===519) resetLove();
}

// ── 3. THE CANVAS — pixels selecting & stabilising ──
let can2=[],can2T=0;
const G=20; // grid 20x20 cells in the little canvas
function resetCanvas2(){
  can2=[];
  for(let i=0;i<G*G;i++) can2.push({h:Math.random()*40+5,l:8+Math.random()*6,stab:0});
  can2T=0;
}
function drawCanvas2(){
  can2T++;
  const cell=AS/G;
  // occasional "selection" event — a cluster stabilises and warms
  if(can2T%26===0){
    const cxk=Math.floor(Math.random()*G),cyk=Math.floor(Math.random()*G);
    const rad=1+Math.floor(Math.random()*2);
    for(let dy=-rad;dy<=rad;dy++)for(let dx=-rad;dx<=rad;dx++){
      const x=cxk+dx,y=cyk+dy;
      if(x<0||x>=G||y<0||y>=G)continue;
      if(Math.hypot(dx,dy)>rad)continue;
      const idx=y*G+x;
      can2[idx].stab=Math.min(2,can2[idx].stab+1);
      can2[idx].h=30+Math.random()*20; can2[idx].l=45+Math.random()*20;
    }
  }
  for(let i=0;i<G*G;i++){
    const c=can2[i];
    // free cells drift; stabilised cells hold
    if(c.stab===0){
      if(Math.random()<0.04){c.h+=Math.random()*10-5;c.l=8+Math.random()*8;}
    }else{
      c.l+=Math.sin(can2T*0.05+i)*0.4; // gentle shimmer
    }
    const x=(i%G)*cell,y=Math.floor(i/G)*cell;
    can2Ctx.fillStyle=`hsl(${c.h},${c.stab?75:40}%,${c.l}%)`;
    can2Ctx.fillRect(x,y,cell+0.5,cell+0.5);
  }
  if(can2T%240===0) resetCanvas2();
}

function startScaleAnims(){
  resetCells();resetLove();resetCanvas2();
  let f=0;
  function tick(){
    // throttle to ~30fps for these small loops
    f++;
    if(f%2===0){ drawCellScene(); drawLoveScene(); drawCanvas2(); }
    scaleAnimRAF=requestAnimationFrame(tick);
  }
  tick();
}
function stopScaleAnims(){
  if(scaleAnimRAF){cancelAnimationFrame(scaleAnimRAF);scaleAnimRAF=null;}
}
function showBegin(){
  const c=document.getElementById('controls');
  c.style.display='flex';
  c.innerHTML='<a href="app.html" class="ctrl-btn primary">Enter Germinal →</a>';
}

// ─── Playback control ───
const voice=document.getElementById('voice');
const gate=document.getElementById('startGate');
const prog=document.getElementById('progress');
let fired=new Set();

// ─────────────────────────────────────────────────────────────
// AMBIENT DRONE — synthesized live, no audio file.
// Two detuned low oscillators + a high shimmer, through a slow
// low-pass filter sweep. Kept very quiet so the voice stays clear.
// ─────────────────────────────────────────────────────────────
let audioCtx=null, droneGain=null, droneNodes=[];
function startDrone(){
  if(audioCtx) return;
  try{
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  }catch(e){ console.warn('No Web Audio',e); return; }

  const master=audioCtx.createGain();
  master.gain.value=0.0;
  master.connect(audioCtx.destination);
  droneGain=master;

  // Low-pass filter that slowly opens and closes for an eerie swell
  const filter=audioCtx.createBiquadFilter();
  filter.type='lowpass';
  filter.frequency.value=320;
  filter.Q.value=6;
  filter.connect(master);

  // Slow LFO on the filter cutoff
  const lfo=audioCtx.createOscillator();
  const lfoGain=audioCtx.createGain();
  lfo.frequency.value=0.05;     // very slow sweep
  lfoGain.gain.value=180;
  lfo.connect(lfoGain);lfoGain.connect(filter.frequency);
  lfo.start();

  // Two detuned low drones — a minor-second-ish beat for unease
  const freqs=[55, 55.4, 82.5];   // A1, slightly sharp A1, E2
  freqs.forEach((f,i)=>{
    const osc=audioCtx.createOscillator();
    osc.type=i===2?'triangle':'sawtooth';
    osc.frequency.value=f;
    const g=audioCtx.createGain();
    g.gain.value=i===2?0.12:0.2;
    osc.connect(g);g.connect(filter);
    osc.start();
    droneNodes.push(osc,g);
  });

  // High sparse shimmer — a faint bell-like sine that drifts
  const shimmer=audioCtx.createOscillator();
  shimmer.type='sine';
  shimmer.frequency.value=880;
  const shGain=audioCtx.createGain();
  shGain.gain.value=0.0;
  shimmer.connect(shGain);shGain.connect(master);
  shimmer.start();
  // drift the shimmer pitch slowly
  const shLfo=audioCtx.createOscillator();
  const shLfoG=audioCtx.createGain();
  shLfo.frequency.value=0.07;shLfoG.gain.value=40;
  shLfo.connect(shLfoG);shLfoG.connect(shimmer.frequency);shLfo.start();
  droneNodes.push(shimmer,shGain,shLfo,shLfoG,lfo,lfoGain,filter);
  window._shGain=shGain;

  // Fade master in gently over 4s to a low bed level
  const now=audioCtx.currentTime;
  master.gain.setValueAtTime(0,now);
  master.gain.linearRampToValueAtTime(0.12,now+4);
}
// Set the drone bed level (0..1 scaled) with a smooth ramp
function droneLevel(v,ramp){
  if(!audioCtx||!droneGain)return;
  const now=audioCtx.currentTime;
  droneGain.gain.cancelScheduledValues(now);
  droneGain.gain.linearRampToValueAtTime(v,now+(ramp||2));
}
// Briefly bring up the high shimmer for emphasis (e.g. "let there be light")
function droneShimmer(v,ramp){
  if(!audioCtx||!window._shGain)return;
  const now=audioCtx.currentTime;
  window._shGain.gain.cancelScheduledValues(now);
  window._shGain.gain.linearRampToValueAtTime(v,now+(ramp||3));
}

function startExperience(){
  try{localStorage.setItem('germinal_intro_seen','1');}catch(e){}
  gate.classList.add('hide');
  document.getElementById('controls').style.display='flex';
  startDrone();
  voice.play().catch(e=>console.warn('Audio play failed',e));
}
gate.addEventListener('click',startExperience);

voice.addEventListener('timeupdate',()=>{
  const t=voice.currentTime;
  prog.style.width=(t/voice.duration*100)+'%';
  for(let idx=0;idx<timeline.length;idx++){
    const [cue,action]=timeline[idx];
    if(t>=cue && !fired.has(idx)){fired.add(idx);action();}
  }
});
voice.addEventListener('ended',()=>{
  // Ensure final state
  if(!fired.has(timeline.length-1)){
    timeline[timeline.length-1][1]();
  }
  prog.style.width='100%';
  // Let the drone linger a moment, then fade out
  droneLevel(0.06,6);
  droneShimmer(0.0,5);
});

// Fallback: if audio fails to load, allow manual progression via a timer
voice.addEventListener('error',()=>{
  console.warn('Audio failed — running timeline on internal clock');
  gate.querySelector('.sg-note').textContent='Audio unavailable · tap to read intro';
  gate.addEventListener('click',()=>{
    let start=Date.now();
    setInterval(()=>{
      const t=(Date.now()-start)/1000;
      prog.style.width=Math.min(100,t/117*100)+'%';
      for(let idx=0;idx<timeline.length;idx++){
        const[cue,action]=timeline[idx];
        if(t>=cue&&!fired.has(idx)){fired.add(idx);action();}
      }
    },200);
  },{once:true});
});
</script>
