<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Germinal · Live Display</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Courier+Prime&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--gold:#c8a96e;--bg:#06060f;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);}
#canvas-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
#display{display:block;image-rendering:pixelated;image-rendering:crisp-edges;
  max-width:100vw;max-height:100vh;}
/* HUD overlay */
#hud{position:fixed;bottom:0;left:0;right:0;
  background:linear-gradient(to top,rgba(6,6,15,.9),transparent);
  padding:24px 32px 20px;display:flex;align-items:flex-end;
  justify-content:space-between;z-index:10;}
.hud-left h1{font-family:'Cormorant Garamond',serif;font-size:28px;
  font-weight:300;font-style:italic;color:#f0e8d8;letter-spacing:.04em;}
.hud-left h1 em{color:var(--gold);}
.hud-left .sub{font-family:'Courier Prime',monospace;font-size:10px;
  letter-spacing:.25em;text-transform:uppercase;color:rgba(255,255,255,.3);
  margin-top:4px;}
.hud-right{text-align:right;display:flex;flex-direction:column;gap:2px;}
.hud-stat .v{font-family:'Courier Prime',monospace;font-size:14px;
  color:var(--gold);display:block;}
.hud-stat .l{font-family:'Courier Prime',monospace;font-size:8px;
  letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.25);}
/* Watermark for free tier */
#watermark{position:fixed;top:20px;right:24px;
  font-family:'Courier Prime',monospace;font-size:9px;letter-spacing:.2em;
  text-transform:uppercase;color:rgba(200,169,110,.3);
  pointer-events:none;z-index:10;}
/* Loading */
#loading{position:fixed;inset:0;display:flex;align-items:center;
  justify-content:center;background:var(--bg);z-index:20;}
#loading p{font-family:'Courier Prime',monospace;font-size:10px;
  letter-spacing:.3em;text-transform:uppercase;color:rgba(200,169,110,.5);}
</style>
</head>
<body>
<div id="loading"><p>Loading live canvas…</p></div>
<div id="canvas-wrap"><canvas id="display"></canvas></div>
<div id="hud">
  <div class="hud-left">
    <h1>Ger<em>minal</em></h1>
    <div class="sub" id="hudSub">Loading…</div>
  </div>
  <div class="hud-right">
    <div class="hud-stat"><span class="v" id="hudGen">—</span><span class="l">generation</span></div>
    <div class="hud-stat"><span class="v" id="hudContribs">—</span><span class="l">contributors</span></div>
  </div>
</div>
<div id="watermark">germinal.studio</div>

<script>
const CS=2, WC=900, WR=660, WW=WC*CS, WH=WR*CS, WT=WC*WR;
const cvs=document.getElementById('display');
const ctx=cvs.getContext('2d');
cvs.width=WW; cvs.height=WH;

// Scale canvas to fit screen
function resize(){
  const scale=Math.min(window.innerWidth/WW, window.innerHeight/WH);
  cvs.style.width=(WW*scale)+'px';
  cvs.style.height=(WH*scale)+'px';
}
resize();
window.addEventListener('resize', resize);

let cells=[];
let localGen=0;

function h2r(h){if(!h||h.length<7)return[128,128,128];
  return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function r2h(r,g,b){return'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0')).join('');}
function unq(q){const r=((q>>10)&31)<<3,g=((q>>5)&31)<<3,b=(q&31)<<3;return r2h(r,g,b);}

function decodeCanvas(b64){
  try{
    const bin=atob(b64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const arr=new Uint16Array(bytes.buffer);
    cells=Array.from({length:Math.min(WT,arr.length)},(_,i)=>({
      c:unq(arr[i]&0x7FFF),
      s:(arr[i]&0x8000)?1:0
    }));
    while(cells.length<WT) cells.push({c:'#0a0a14',s:0});
  }catch(e){
    console.error('Decode failed',e);
    cells=Array.from({length:WT},()=>({c:'#0a0a14',s:0}));
  }
}

function render(){
  const img=ctx.createImageData(WW,WH);const d=img.data;
  for(let i=0;i<WT;i++){
    const[r,g,b]=h2r(cells[i]?.c||'#0a0a14');
    const col=i%WC,row=Math.floor(i/WC),bx=col*CS,by=row*CS;
    for(let cy=0;cy<CS;cy++)for(let cx=0;cx<CS;cx++){
      const pi=((by+cy)*WW+(bx+cx))*4;
      d[pi]=r;d[pi+1]=g;d[pi+2]=b;d[pi+3]=255;
    }
  }
  ctx.putImageData(img,0,0);
}

// Gentle local evolution between server refreshes
function stepLocal(){
  const NOISE=['#ff0000','#ff4400','#ff8800','#ffcc00','#00aaff','#8800ff','#ffffff','#111111'];
  for(let i=0;i<WT;i++){
    if(cells[i].s===1) continue;
    if(Math.random()>0.015) continue;
    const c=i%WC,r=Math.floor(i/WC),nb=[];
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      if(!dx&&!dy)continue;
      const nx=c+dx,ny=r+dy;
      if(nx>=0&&nx<WC&&ny>=0&&ny<WR) nb.push(cells[ny*WC+nx].c);
    }
    if(nb.length&&Math.random()<.7){
      const[r1,g1,b1]=h2r(nb[Math.floor(Math.random()*nb.length)]);
      const grain=(Math.random()-.5)*12;
      cells[i].c=r2h(Math.round(r1+grain),Math.round(g1+grain),Math.round(b1+grain));
    }else{
      cells[i].c=NOISE[Math.floor(Math.random()*NOISE.length)];
    }
  }
  localGen++;
}

// Fetch from server every 60 seconds
async function fetchLive(){
  const theme=new URLSearchParams(location.search).get('theme')||'love';
  try{
    const res=await fetch(`/.netlify/functions/display-live?theme=${theme}`);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data=await res.json();
    decodeCanvas(data.cellData);
    localGen=data.generation;
    document.getElementById('hudGen').textContent=data.generation.toLocaleString();
    document.getElementById('hudContribs').textContent=
      (data.contributorCount||0).toLocaleString();
    document.getElementById('hudSub').textContent=
      `"${data.theme}" · last updated ${new Date(data.lastUpdated).toLocaleTimeString()}`;
    document.getElementById('loading').style.display='none';
    render();
  }catch(e){
    console.error('Fetch failed:',e);
    // Show demo canvas if no server yet
    if(cells.length===0){
      cells=Array.from({length:WT},()=>({
        c:`hsl(${Math.floor(Math.random()*30+10)},${60+Math.random()*30}%,${20+Math.random()*30}%)`,
        s:0
      }));
      document.getElementById('loading').style.display='none';
      document.getElementById('hudSub').textContent='Demo mode — server not yet connected';
      render();
    }
  }
}

// Render loop — step locally every 3 seconds, fetch from server every 60s
fetchLive();
setInterval(fetchLive, 60000);
setInterval(()=>{stepLocal();render();}, 3000);
</script>
</body>
</html>
