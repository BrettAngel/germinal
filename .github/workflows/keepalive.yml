# Keeps the PREVIEW Supabase database active so the free tier doesn't pause it
# (free projects pause after 7 days with no database queries).
# Preview-only for now: pings the live-wall-compositor preview, not production
# (germinal.studio). No secrets: it calls our public API.
# Scheduled workflows run only from the default branch, so the cron starts
# once this is on main. Until then: Actions tab → Run workflow.
name: Keep Supabase awake

on:
  schedule:
    - cron: '0 9 * * 1,4'   # 09:00 UTC every Monday and Thursday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping preview Germinal API (triggers a DB query)
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" "https://live-wall-compositor.germinal.pages.dev/api/display-live?theme=love" || true
