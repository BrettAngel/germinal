<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Germinal · Living Display</title>
<meta name="description" content="A living canvas evolving through collective human attention. Scan to join.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Courier+Prime&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--gold:#c8a96e;--bg:#06060f;--txt:#e8e0d0;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
  font-family:'Cormorant Garamond',serif;cursor:default;}
body.hide-cursor{cursor:none;}

/* ── Canvas ── */
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  transition:padding .6s ease;}
#stage.framed{padding:5vh 26vw 5vh 5vw;}
#display{display:block;image-rendering:pixelated;image-rendering:crisp-edges;
  max-width:100%;max-height:100%;box-shadow:0 0 80px rgba(0,0,0,.6);
  transition:box-shadow .6s;}
#stage.framed #display{box-shadow:0 0 60px rgba(0,0,0,.8),0 0 0 1px rgba(200,169,110,.15);}

/* ── Event-driven overlay (pure-art mode): fades in on evolution ── */
#pulse{position:fixed;left:50%;bottom:6vh;transform:translateX(-50%);
  display:flex;align-items:center;gap:18px;padding:14px 26px;
  background:rgba(6,6,15,.55);backdrop-filter:blur(10px);
  border:1px solid rgba(200,169,110,.18);border-radius:40px;
  opacity:0;transition:opacity 1.1s ease;z-index:10;pointer-events:none;white-space:nowrap;}
#pulse.show{opacity:1;}
#pulse .p-theme{font-style:italic;font-size:clamp(15px,2.2vw,22px);color:#f0e8d8;}
#pulse .p-theme em{color:var(--gold);}
#pulse .p-sep{width:1px;height:20px;background:rgba(200,169,110,.25);}
#pulse .p-stat{font-family:'Courier Prime',monospace;font-size:clamp(9px,1.3vw,12px);
  letter-spacing:.12em;text-transform:uppercase;color:rgba(232,224,208,.65);}
#pulse .p-stat b{color:var(--gold);font-weight:400;}

/* ── Frame-mode info panel (right side) ── */
#frame{position:fixed;top:0;right:0;bottom:0;width:22vw;min-width:240px;
  background:linear-gradient(180deg,rgba(10,10,20,.92),rgba(6,6,15,.96));
  border-left:1px solid rgba(200,169,110,.15);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:28px;padding:40px 28px;z-index:11;
  transform:translateX(100%);transition:transform .6s ease;}
#frame.show{transform:translateX(0);}
.f-logo{font-family:'Courier Prime',monospace;font-size:11px;letter-spacing:.4em;
  text-transform:uppercase;color:var(--gold);}
.f-name{font-size:clamp(30px,3.4vw,46px);font-weight:300;font-style:italic;color:#f4ecda;
  line-height:.95;text-align:center;}
.f-theme{font-size:clamp(17px,2vw,22px);font-style:italic;color:var(--txt);text-align:center;}
.f-theme em{color:var(--gold);}
.f-stats{display:flex;flex-direction:column;gap:14px;width:100%;align-items:center;}
.f-stat{text-align:center;}
.f-stat .v{font-family:'Courier Prime',monospace;font-size:clamp(20px,2.6vw,30px);
  color:var(--gold);display:block;line-height:1;}
.f-stat .l{font-family:'Courier Prime',monospace;font-size:11px;letter-spacing:.22em;
  text-transform:uppercase;color:rgba(232,224,208,.7);margin-top:5px;}
.f-qr{background:#fff;padding:12px;border-radius:10px;line-height:0;}
.f-qr canvas,.f-qr img{display:block;width:clamp(120px,12vw,168px);height:auto;}
.f-scan{font-family:'Courier Prime',monospace;font-size:12px;letter-spacing:.18em;
  text-transform:uppercase;color:rgba(232,224,208,.55);text-align:center;line-height:1.7;}
.f-scan b{color:var(--gold);}

/* ── Floating QR for pure-art mode (auto-hides) ── */
/* Always-visible "Scan to join" card (bottom-right) */
#floatQR{position:fixed;bottom:24px;right:24px;z-index:10;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  background:rgba(6,6,15,.72);backdrop-filter:blur(8px);
  border:1px solid rgba(200,169,110,.28);padding:10px 10px 12px;border-radius:12px;
  opacity:.95;transition:opacity 1.2s ease;pointer-events:none;
  box-shadow:0 4px 30px rgba(0,0,0,.4);}
#floatQR .fq-code{background:#fff;padding:6px;border-radius:6px;line-height:0;}
#floatQR canvas,#floatQR img{display:block;width:clamp(96px,9vw,140px);height:auto;}
#floatQR .fq-label{font-family:'Courier Prime',monospace;font-size:clamp(11px,1.1vw,14px);letter-spacing:.18em;
  text-transform:uppercase;color:var(--gold);white-space:nowrap;}
body.framed #floatQR{opacity:0;}
#demoNote{position:fixed;top:18px;left:18px;z-index:10;font-family:'Courier Prime',monospace;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(232,224,208,.7);
  background:rgba(6,6,15,.55);padding:6px 10px;border-radius:6px;display:none;}
body.demo #demoNote{display:block;}
/* HONESTY PASS: generation / contribution counts are only shown when they come
   from the server (live) or from this screen's last real fetch (cached). In the
   local simulation there is no real number, so the stats are hidden. */
body.sim .real-stat{display:none !important;}
.no-count{display:none !important;}
/* Narrow screens: lift the status pill above the QR card so they never overlap */
@media (max-width:760px){
  #pulse{bottom:calc(24px + 96px + 60px);max-width:calc(100vw - 32px);gap:10px;padding:10px 16px;}
  #floatQR{right:50%;transform:translateX(50%);}
}

/* ── Controls (top-right, auto-hide) ── */
#controls{position:fixed;top:18px;right:18px;display:flex;gap:8px;z-index:14;
  opacity:0;transition:opacity .4s;}
#controls.show{opacity:1;}
.ctrl{width:40px;height:40px;border-radius:50%;border:1px solid rgba(200,169,110,.3);
  background:rgba(6,6,15,.6);backdrop-filter:blur(8px);color:var(--gold);
  font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .2s;}
.ctrl:hover{background:rgba(200,169,110,.18);}

/* ── Loading ── */
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--bg);z-index:30;transition:opacity 1s;}
#loading.gone{opacity:0;pointer-events:none;}
#loading p{font-family:'Courier Prime',monospace;font-size:10px;letter-spacing:.3em;
  text-transform:uppercase;color:rgba(200,169,110,.5);}
</style>
</head>
<body>
<div id="loading"><p>The canvas is waking…</p></div>

<div id="stage"><canvas id="display"></canvas></div>

<!-- pure-art event overlay -->
<div id="pulse">
  <span class="p-theme">"<em id="pTheme">love</em>"</span>
  <span class="p-sep real-stat"></span>
  <span class="p-stat real-stat">Gen <b id="pGen">—</b></span>
  <span class="p-sep real-stat" id="pContribsSep"></span>
  <span class="p-stat real-stat" id="pContribsWrap"><b id="pContribs">—</b> contributions</span>
</div>

<!-- floating QR (pure-art mode) -->
<div id="floatQR"><span class="fq-label">Scan to join</span><div class="fq-code" id="floatQRcode"></div></div>
<div id="demoNote">Simulation · waiting for the first saved canvas</div>

<!-- frame-mode info panel -->
<div id="frame">
  <div class="f-logo">germinal.studio</div>
  <div class="f-name">Germinal</div>
  <div class="f-theme">"<em id="fTheme">love</em>"</div>
  <div class="f-stats">
    <div class="f-stat real-stat"><span class="v" id="fGen">—</span><span class="l">generation</span></div>
    <div class="f-stat real-stat" id="fContribsWrap"><span class="v" id="fContribs">—</span><span class="l">contributions</span></div>
  </div>
  <div class="f-qr"><div id="frameQRcode"></div></div>
  <div class="f-scan"><b>Scan to join</b><br>add your eye to the canvas</div>
</div>

<!-- controls -->
<div id="controls">
  <button class="ctrl" id="btnFrame" title="Toggle info frame">▤</button>
  <button class="ctrl" id="btnFull" title="Fullscreen">⛶</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<!-- PROTOTYPE (variant B): label only. The display is main's; the server reads this branch's namespaced theme (pb-…). -->
<div id="protoTag" style="position:fixed;bottom:10px;left:10px;z-index:20;font-family:'Courier Prime',monospace;font-size:11px;
  letter-spacing:.12em;text-transform:uppercase;color:#e8d8b0;background:rgba(6,6,15,.7);border:1px solid rgba(200,169,110,.4);
  border-radius:6px;padding:4px 8px;pointer-events:none;">Prototype · live wall (real engine +<script type="module">
// ═══════════════════════════════════════════════════════════════════
// GERMINAL LIVING DISPLAY — PREVIEW (branch live-wall-compositor)
// The wall runs MAIN'S REAL EVOLVE ENGINE (engine/germinal-engine.js, generated
// byte-identical from app.html; tests/live-wall.test.mjs) plus the patch
// compositor (lib/patch.js, SIM4 "N1"). No local drift of its own.
//   · cadence: ~12 real Evolves per wall-hour (?rate=6–20); ?fast=1 = demo (clock ×120, one Evolve every ~2.5 s)
//   · between Evolves: a display-only PIXEL DISSOLVE — changed cells switch to
//     their new (real engine) colour in random order. No blending, no glow, no outlines.
//   · flags (default ON): ?conflevel=0 (confident patches land at hold level 2+), ?refresh=0 (re-selection restarts a patch's fade)
// Pure-art default + event-driven info fade-ins + auto-hiding QR; frame mode as before.
// ═══════════════════════════════════════════════════════════════════
const WC=900, WR=660, WT=WC*WR;
const QS=new URLSearchParams(location.search);
// Same theme rules as the API (lib/validate.js), so odd ?theme= values don't 400.
const theme=(String(QS.get('theme')||'').toLowerCase()
  .normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 \-]+/g,' ')
  .replace(/\s+/g,' ').trim().slice(0,40).trim())||'love';
const startFramed=QS.get('frame')==='1';
const FAST=QS.get('fast')==='1';
const RATE=Math.max(6,Math.min(20,Number(QS.get('rate'))||12));        // Evolves per wall-hour (SIM4 N1: 6–20)
const WARP=FAST?120:1;                                                   // demo clock speed
const FLAGS={confLevel:QS.get('conflevel')!=='0', refresh:QS.get('refresh')!=='0'};
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const T0=Date.now(); const wallNow=()=>T0+(Date.now()-T0)*WARP;
window.__wall={fast:FAST,rate:RATE,flags:FLAGS,frames:0,steps:0,mode:'init',stats:null};

const cvs=document.getElementById('display');
const ctx=cvs.getContext('2d');
cvs.width=WC; cvs.height=WR;                 // one canvas pixel per cell; CSS scales it up, pixelated
const img=ctx.createImageData(WC,WR);

const joinURL = `${location.origin}/app.html?theme=${encodeURIComponent(theme)}`;

function resize(){
  const stage=document.getElementById('stage');
  const pad=stage.classList.contains('framed');
  const availW=window.innerWidth*(pad?0.72:1);
  const availH=window.innerHeight*(pad?0.90:1);
  const scale=Math.min(availW/WC, availH/WR);
  cvs.style.width=(WC*scale)+'px';
  cvs.style.height=(WR*scale)+'px';
}
window.addEventListener('resize', resize);

// ── The wall core: Worker if possible, else in the page (same code) ──
function makeCore(){
  let w=null, seq=0; const pend=new Map();
  try{
    w=new Worker('/engine/wall-worker.js',{type:'module'});
    w.onmessage=e=>{const p=pend.get(e.data.id);if(!p)return;pend.delete(e.data.id);e.data.ok?p.res(e.data.out):p.rej(new Error(e.data.error));};
    w.onerror=e=>{console.warn('wall worker error',e.message);for(const p of pend.values())p.rej(new Error('worker'));pend.clear();w=null;};
  }catch(e){ w=null; }
  let local=null;
  async function inPage(type,a){
    if(!local){ const {WallCore}=await import('/lib/wall-core.js'); local={WallCore,core:null}; }
    if(type==='boot'){ local.core=new local.WallCore(a.opts); return local.core.boot(a); }
    if(type==='patches') return local.core.addPatches(a.list,a.now,true);
    return local.core.step(a.now);
  }
  return {call(type,a){
    if(!w) return inPage(type,a);
    return new Promise((res,rej)=>{const id=++seq;pend.set(id,{res,rej});w.postMessage({id,type,a});
      setTimeout(()=>{if(pend.has(id)){pend.delete(id);rej(new Error('worker timeout'));}},90000);})
      .catch(err=>{ console.warn('wall worker failed, running in page:',err.message); try{w&&w.terminate();}catch(e){} w=null;
        if(type==='boot') return inPage(type,a); throw err; });
  }, get worker(){return !!w;}};
}
let core=makeCore();

// ── Display: pixel dissolve between Evolve states (display-only, real colours only) ──
let shown=null, dissolving=null;
function finishDissolve(){ if(!dissolving) return; const {next,order}=dissolving; const d=img.data;
  for(let k=dissolving.k;k<order.length;k++){const o=order[k]*4;d[o]=next[o];d[o+1]=next[o+1];d[o+2]=next[o+2];d[o+3]=255;}
  ctx.putImageData(img,0,0); shown=next; dissolving=null; }
function show(next){
  finishDissolve(); window.__wall.frames++;
  const d=img.data;
  if(!shown||RM){ d.set(next); ctx.putImageData(img,0,0); shown=next; return; }
  const order=[]; for(let i=0;i<WT;i++){const o=i*4; if(next[o]!==shown[o]||next[o+1]!==shown[o+1]||next[o+2]!==shown[o+2]) order.push(i);}
  for(let i=order.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;const t=order[i];order[i]=order[j];order[j]=t;}
  window.__wall.lastChanged=order.length;
  const dur=FAST?1200:4000, t0=performance.now();
  dissolving={next,order,k:0};
  const tick=now=>{ if(!dissolving||dissolving.next!==next) return;
    const want=Math.min(order.length,Math.ceil(order.length*Math.min(1,(now-t0)/dur)));
    for(let k=dissolving.k;k<want;k++){const o=order[k]*4;d[o]=next[o];d[o+1]=next[o+1];d[o+2]=next[o+2];}
    dissolving.k=want; ctx.putImageData(img,0,0);
    if(want<order.length) requestAnimationFrame(tick); else { shown=next; dissolving=null; } };
  requestAnimationFrame(tick);
}
function onFrame(out){ window.__wall.stats=out.stats; window.__wall.wallGen=out.generation; show(out.rgba); }

// ── Event overlay (pure-art mode): fade in briefly on an evolution ──
let pulseTimer=null;
function showPulse(){
  if(document.body.classList.contains('framed')) return;
  const p=document.getElementById('pulse');
  p.classList.add('show');
  clearTimeout(pulseTimer);
  pulseTimer=setTimeout(()=>p.classList.remove('show'), 5200);
}
function setStats(gen, contribs){
  document.getElementById('pGen').textContent=(gen||0).toLocaleString();
  document.getElementById('fGen').textContent=(gen||0).toLocaleString();
  const has = typeof contribs==='number' && isFinite(contribs);
  ['pContribsWrap','pContribsSep','fContribsWrap'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.classList.toggle('no-count', !has);
  });
  if(has){
    document.getElementById('pContribs').textContent=contribs.toLocaleString();
    document.getElementById('fContribs').textContent=contribs.toLocaleString();
  }
}

// ── Server data, with graceful fallback ──
// Boot: live API (canvas + patches) → last data cached on this screen → main's start canvas.
// Then: poll new patches every 60 s (backoff 30 s → 10 min on failure). Never sits on the loading screen.
const CACHE_KEY='germinal_live_'+theme, PCACHE_KEY='germinal_patches_'+theme;
const MAX_AGE_MS=17*24*3600e3;
let mode='init', curGen=0, curContribs=null, lastCreated=null, patches=[];
function setMode(m){
  mode=m; window.__wall.mode=m;
  document.getElementById('demoNote').textContent =
    m==='cached' ? 'Offline · showing the last saved canvas' : 'Simulation · waiting for the first saved canvas';
  document.body.classList.toggle('demo', m!=='live');
  document.body.classList.toggle('sim', m==='demo');
}
async function getJSON(url){
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),15000);
  try{ const res=await fetch(url,{signal:ctl.signal}); const data=await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.error||('HTTP '+res.status)); return data; }
  finally{ clearTimeout(t); }
}
async function fetchPatches(since){
  let out=[], meta=null;
  for(let page=0;page<10;page++){
    const d=await getJSON(`/api/display-live?theme=${encodeURIComponent(theme)}&patches=1&since=${encodeURIComponent(since)}`);
    meta=d; const ps=Array.isArray(d.patches)?d.patches:[]; out=out.concat(ps);
    if(ps.length<(d.limit||200)) break; since=ps[ps.length-1].created;
  }
  return {list:out, meta};
}
function notePatches(list){
  for(const p of list){ if(!lastCreated||p.created>lastCreated) lastCreated=p.created; }
  const horizon=new Date(Date.now()-MAX_AGE_MS).toISOString();
  patches=patches.concat(list).filter(p=>p.created>horizon).slice(-400);
  try{ localStorage.setItem(PCACHE_KEY, JSON.stringify(patches)); }catch(e){}
}
const opts={theme, flags:FLAGS};
let booted=false, connected=false;
async function bootFrom(src){
  const out=await core.call('boot',{opts, cellData:src.cellData||null, lastUpdated:src.lastUpdated||null, patches:src.patches||[], now:wallNow()});
  booted=true; onFrame(out);
  document.getElementById('loading').classList.add('gone');
  showPulse();
}
async function bootLive(){
  const since=new Date(Date.now()-MAX_AGE_MS).toISOString();
  const [live, ps]=await Promise.all([getJSON(`/api/display-live?theme=${encodeURIComponent(theme)}`), fetchPatches(since)]);
  if(!live.cellData&&!ps.list.length&&!live.empty) throw new Error('no data');
  curGen=live.generation||0; curContribs=(typeof live.contributorCount==='number')?live.contributorCount:null;
  patches=[]; notePatches(ps.list);
  await bootFrom({cellData:live.cellData, lastUpdated:live.lastUpdated, patches:ps.list});
  connected=true; setStats(curGen,curContribs); setMode(live.cellData||ps.list.length?'live':'demo');
  if(live.cellData){ try{ localStorage.setItem(CACHE_KEY, JSON.stringify({cellData:live.cellData,generation:curGen,contributorCount:curContribs,lastUpdated:live.lastUpdated})); }catch(e){} }
}
async function bootFallback(){
  if(booted) return;
  let cached=null, cps=[];
  try{ cached=JSON.parse(localStorage.getItem(CACHE_KEY)||'null'); cps=JSON.parse(localStorage.getItem(PCACHE_KEY)||'[]'); }catch(e){}
  if(cached&&cached.cellData){
    curGen=cached.generation||0; curContribs=(typeof cached.contributorCount==='number')?cached.contributorCount:null;
    patches=[]; notePatches(cps);
    await bootFrom({cellData:cached.cellData, lastUpdated:cached.lastUpdated, patches:cps});
    setStats(curGen,curContribs); setMode('cached');
  }else{ await bootFrom({}); setMode('demo'); }
}
let backoff=0, pollTimer=null;
function schedulePoll(ms){ clearTimeout(pollTimer); pollTimer=setTimeout(poll, ms); }
async function poll(){
  try{
    if(!connected){ await bootLive(); }                               // first contact / back online: rebuild from the server
    else{
      const {list, meta}=await fetchPatches(lastCreated||new Date(Date.now()-MAX_AGE_MS).toISOString());
      const fresh=list.filter(p=>!patches.some(q=>q.id===p.id));
      if(fresh.length){ notePatches(fresh); onFrame(await core.call('patches',{list:fresh, now:wallNow()})); if(mode!=='live') setMode('live'); }
      const g=meta&&meta.generation; if(typeof g==='number'&&g!==curGen){ curGen=g; showPulse(); }
      if(meta&&typeof meta.contributorCount==='number') curContribs=meta.contributorCount;
      setStats(curGen,curContribs);
    }
    backoff=0; schedulePoll(60000);
  }catch(e){
    console.info('Live feed unavailable:', e.message);
    if(!booted) await bootFallback().catch(err=>console.warn(err));
    backoff=Math.min(600000, backoff?backoff*2:30000); schedulePoll(backoff*(0.8+Math.random()*0.4));
  }
}
window.addEventListener('online',()=>schedulePoll(1000));

// ── The wall's Evolve loop: real stepGen at the wall cadence ──
let stepping=false;
async function evolveOnce(){
  if(!booted||stepping) return; stepping=true;
  try{ onFrame(await core.call('step',{now:wallNow()})); window.__wall.steps++; }
  catch(e){ console.warn('step failed:',e.message); if(!core.worker){ core=makeCore(); booted=false; connected=false; schedulePoll(1000); } }
  finally{ stepping=false; }
}
const STEP_MS=FAST?2500:Math.round(3600000/RATE);

// ── QR generation (qrcodejs) ──
function makeQR(elId, size){
  const el=document.getElementById(elId);
  if(!el||!window.QRCode) return;
  el.innerHTML='';
  new QRCode(el,{text:joinURL,width:size,height:size,
    colorDark:'#06060f',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
}

// ── Frame / pure-art mode toggle ──
function setFramed(on){
  document.body.classList.toggle('framed', on);
  document.getElementById('stage').classList.toggle('framed', on);
  document.getElementById('frame').classList.toggle('show', on);
  const fq=document.getElementById('floatQR');
  if(on) fq.classList.remove('show');
  resize();
}
document.getElementById('btnFrame').addEventListener('click',()=>{
  setFramed(!document.body.classList.contains('framed'));
});
document.getElementById('btnFull').addEventListener('click',()=>{
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
});
let idleTimer=null;
function wake(){
  document.getElementById('controls').classList.add('show');
  document.body.classList.remove('hide-cursor');
  clearTimeout(idleTimer);
  idleTimer=setTimeout(()=>{
    document.getElementById('controls').classList.remove('show');
    document.body.classList.add('hide-cursor');
  }, 3500);
}
['mousemove','touchstart','keydown'].forEach(ev=>window.addEventListener(ev,wake));

// ── Boot ──
function boot(){
  document.getElementById('pTheme').textContent=theme;
  document.getElementById('fTheme').textContent=theme;
  if(FAST) document.getElementById('protoTag').textContent+=' · fast demo ×'+WARP;
  resize();
  makeQR('floatQRcode',140);
  makeQR('frameQRcode',168);
  poll();
