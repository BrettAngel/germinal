<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Germinal · Living Display</title>
<meta name="description" content="A living canvas evolving through collective human attention. Scan to join.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Courier+Prime&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--gold:#c8a96e;--bg:#06060f;--txt:#e8e0d0;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
  font-family:'Cormorant Garamond',serif;cursor:default;}
body.hide-cursor{cursor:none;}

/* ── Canvas ── */
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  transition:padding .6s ease;}
#stage.framed{padding:5vh 26vw 5vh 5vw;}
#display{display:block;image-rendering:pixelated;image-rendering:crisp-edges;
  max-width:100%;max-height:100%;box-shadow:0 0 80px rgba(0,0,0,.6);
  transition:box-shadow .6s;}
#stage.framed #display{box-shadow:0 0 60px rgba(0,0,0,.8),0 0 0 1px rgba(200,169,110,.15);}

/* ── Event-driven overlay (pure-art mode): fades in on evolution ── */
#pulse{position:fixed;left:50%;bottom:6vh;transform:translateX(-50%);
  display:flex;align-items:center;gap:18px;padding:14px 26px;
  background:rgba(6,6,15,.55);backdrop-filter:blur(10px);
  border:1px solid rgba(200,169,110,.18);border-radius:40px;
  opacity:0;transition:opacity 1.1s ease;z-index:10;pointer-events:none;white-space:nowrap;}
#pulse.show{opacity:1;}
#pulse .p-theme{font-style:italic;font-size:clamp(15px,2.2vw,22px);color:#f0e8d8;}
#pulse .p-theme em{color:var(--gold);}
#pulse .p-sep{width:1px;height:20px;background:rgba(200,169,110,.25);}
#pulse .p-stat{font-family:'Courier Prime',monospace;font-size:clamp(9px,1.3vw,12px);
  letter-spacing:.12em;text-transform:uppercase;color:rgba(232,224,208,.65);}
#pulse .p-stat b{color:var(--gold);font-weight:400;}

/* ── Frame-mode info panel (right side) ── */
#frame{position:fixed;top:0;right:0;bottom:0;width:22vw;min-width:240px;
  background:linear-gradient(180deg,rgba(10,10,20,.92),rgba(6,6,15,.96));
  border-left:1px solid rgba(200,169,110,.15);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:28px;padding:40px 28px;z-index:11;
  transform:translateX(100%);transition:transform .6s ease;}
#frame.show{transform:translateX(0);}
.f-logo{font-family:'Courier Prime',monospace;font-size:11px;letter-spacing:.4em;
  text-transform:uppercase;color:var(--gold);}
.f-name{font-size:clamp(30px,3.4vw,46px);font-weight:300;font-style:italic;color:#f4ecda;
  line-height:.95;text-align:center;}
.f-theme{font-size:clamp(17px,2vw,22px);font-style:italic;color:var(--txt);text-align:center;}
.f-theme em{color:var(--gold);}
.f-stats{display:flex;flex-direction:column;gap:14px;width:100%;align-items:center;}
.f-stat{text-align:center;}
.f-stat .v{font-family:'Courier Prime',monospace;font-size:clamp(20px,2.6vw,30px);
  color:var(--gold);display:block;line-height:1;}
.f-stat .l{font-family:'Courier Prime',monospace;font-size:8px;letter-spacing:.22em;
  text-transform:uppercase;color:rgba(232,224,208,.4);margin-top:5px;}
.f-qr{background:#fff;padding:12px;border-radius:10px;line-height:0;}
.f-qr canvas,.f-qr img{display:block;width:clamp(120px,12vw,168px);height:auto;}
.f-scan{font-family:'Courier Prime',monospace;font-size:9px;letter-spacing:.18em;
  text-transform:uppercase;color:rgba(232,224,208,.55);text-align:center;line-height:1.7;}
.f-scan b{color:var(--gold);}

/* ── Floating QR for pure-art mode (auto-hides) ── */
#floatQR{position:fixed;bottom:24px;right:24px;z-index:10;
  background:rgba(255,255,255,.92);padding:8px;border-radius:8px;line-height:0;
  opacity:0;transition:opacity 1.2s ease;pointer-events:none;
  box-shadow:0 4px 30px rgba(0,0,0,.4);}
#floatQR.show{opacity:.92;}
#floatQR canvas,#floatQR img{display:block;width:84px;height:84px;}
#floatQR .fq-label{position:absolute;bottom:8px;left:-2px;transform:translateX(-100%);
  font-family:'Courier Prime',monospace;font-size:8px;letter-spacing:.15em;
  text-transform:uppercase;color:rgba(200,169,110,.7);white-space:nowrap;
  background:rgba(6,6,15,.6);padding:4px 8px;border-radius:4px;}

/* ── Controls (top-right, auto-hide) ── */
#controls{position:fixed;top:18px;right:18px;display:flex;gap:8px;z-index:14;
  opacity:0;transition:opacity .4s;}
#controls.show{opacity:1;}
.ctrl{width:40px;height:40px;border-radius:50%;border:1px solid rgba(200,169,110,.3);
  background:rgba(6,6,15,.6);backdrop-filter:blur(8px);color:var(--gold);
  font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .2s;}
.ctrl:hover{background:rgba(200,169,110,.18);}

/* ── Loading ── */
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--bg);z-index:30;transition:opacity 1s;}
#loading.gone{opacity:0;pointer-events:none;}
#loading p{font-family:'Courier Prime',monospace;font-size:10px;letter-spacing:.3em;
  text-transform:uppercase;color:rgba(200,169,110,.5);}
</style>
</head>
<body>
<div id="loading"><p>The canvas is waking…</p></div>

<div id="stage"><canvas id="display"></canvas></div>

<!-- pure-art event overlay -->
<div id="pulse">
  <span class="p-theme">"<em id="pTheme">love</em>"</span>
  <span class="p-sep"></span>
  <span class="p-stat">Gen <b id="pGen">—</b></span>
  <span class="p-sep"></span>
  <span class="p-stat"><b id="pContribs">—</b> contributors</span>
</div>

<!-- floating QR (pure-art mode) -->
<div id="floatQR"><span class="fq-label">scan to join →</span><div id="floatQRcode"></div></div>

<!-- frame-mode info panel -->
<div id="frame">
  <div class="f-logo">germinal.studio</div>
  <div class="f-name">Germinal</div>
  <div class="f-theme">"<em id="fTheme">love</em>"</div>
  <div class="f-stats">
    <div class="f-stat"><span class="v" id="fGen">—</span><span class="l">generation</span></div>
    <div class="f-stat"><span class="v" id="fContribs">—</span><span class="l">contributors</span></div>
  </div>
  <div class="f-qr"><div id="frameQRcode"></div></div>
  <div class="f-scan"><b>Scan to join</b><br>add your eye to the canvas</div>
</div>

<!-- controls -->
<div id="controls">
  <button class="ctrl" id="btnFrame" title="Toggle info frame">▤</button>
  <button class="ctrl" id="btnFull" title="Fullscreen">⛶</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════
// GERMINAL LIVING DISPLAY
// Pure-art default + event-driven info fade-ins + auto-hiding QR.
// Minimize/frame mode with persistent info + permanent QR.
// Theme-aware via ?theme=. Decodes the same RGB555 format the app saves.
// ═══════════════════════════════════════════════════════════════════
const CS=2, WC=900, WR=660, WW=WC*CS, WH=WR*CS, WT=WC*WR;
const theme=(new URLSearchParams(location.search).get('theme')||'love').toLowerCase();
const startFramed=new URLSearchParams(location.search).get('frame')==='1';

const cvs=document.getElementById('display');
const ctx=cvs.getContext('2d');
cvs.width=WW; cvs.height=WH;

// ── Theme deep-link for the QR: scan → succinct intro carrying the theme,
//    with a skip straight to the canvas (intro handles ?theme= & skip). ──
const joinURL = `${location.origin}/intro.html?theme=${encodeURIComponent(theme)}`;

// ── Responsive fit, DPR-aware crispness ──
function resize(){
  const stage=document.getElementById('stage');
  const pad=stage.classList.contains('framed');
  const availW=window.innerWidth*(pad?0.72:1);
  const availH=window.innerHeight*(pad?0.90:1);
  const scale=Math.min(availW/WW, availH/WH);
  cvs.style.width=(WW*scale)+'px';
  cvs.style.height=(WH*scale)+'px';
}
window.addEventListener('resize', resize);

// ── Colour helpers ──
function h2r(h){if(!h||h.length<7)return[128,128,128];
  return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function r2h(r,g,b){return'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,v|0)).toString(16).padStart(2,'0')).join('');}
function unq(q){const r=((q>>10)&31)<<3,g=((q>>5)&31)<<3,b=(q&31)<<3;return r2h(r,g,b);}
function lerpH(h1,h2,t){const[r1,g1,b1]=h2r(h1),[r2,g2,b2]=h2r(h2);
  return r2h(r1+(r2-r1)*t,g1+(g2-g1)*t,b1+(b2-b1)*t);}

let cells=Array.from({length:WT},()=>({c:'#0a0a14',s:0}));
let curGen=0, curContribs=0;

function decodeCanvas(b64){
  try{
    const bin=atob(b64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const arr=new Uint16Array(bytes.buffer);
    const n=Math.min(WT,arr.length);
    for(let i=0;i<n;i++){
      cells[i]={c:unq(arr[i]&0x7FFF), s:(arr[i]&0x8000)?1:0};
    }
    return true;
  }catch(e){ console.warn('decode failed',e); return false; }
}

function render(){
  const img=ctx.createImageData(WW,WH);const d=img.data;
  for(let i=0;i<WT;i++){
    const[r,g,b]=h2r(cells[i]?.c||'#0a0a14');
    const col=i%WC,row=(i/WC)|0,bx=col*CS,by=row*CS;
    for(let cy=0;cy<CS;cy++)for(let cx=0;cx<CS;cx++){
      const pi=((by+cy)*WW+(bx+cx))*4;
      d[pi]=r;d[pi+1]=g;d[pi+2]=b;d[pi+3]=255;
    }
  }
  ctx.putImageData(img,0,0);
}

// ── Gentle FULL-SPECTRUM local evolution between server refreshes ──
// Stabilised cells (s=1) are held — they are the collective's memory.
// Free cells drift: blend toward neighbours (currents) with a small random
// kick (entropy). Sampled, not full-scan, so it's light on low-power screens.
const RAINBOW=['#ff5544','#ffaa22','#ffee44','#88dd33','#44dd88','#33ccbb',
               '#44aaff','#5577ff','#aa66ff','#ee66cc','#ff66aa','#ffffff'];
function stepLocal(){
  const budget=(WT*0.02)|0;
  for(let n=0;n<budget;n++){
    const i=(Math.random()*WT)|0;
    if(cells[i].s===1) continue;
    const c=i%WC, r=(i/WC)|0;
    const ndx=(Math.random()*3|0)-1, ndy=(Math.random()*3|0)-1;
    const nx=c+ndx, ny=r+ndy;
    if(nx>=0&&nx<WC&&ny>=0&&ny<WR){
      cells[i].c=lerpH(cells[i].c, cells[ny*WC+nx].c, 0.25);
    }
    if(Math.random()<0.06){
      cells[i].c=lerpH(cells[i].c, RAINBOW[(Math.random()*RAINBOW.length)|0], 0.18);
    }
  }
}

// ── Event overlay (pure-art mode): fade in briefly on an evolution ──
let pulseTimer=null;
function showPulse(){
  if(document.body.classList.contains('framed')) return;
  const p=document.getElementById('pulse');
  p.classList.add('show');
  clearTimeout(pulseTimer);
  pulseTimer=setTimeout(()=>p.classList.remove('show'), 5200);
}

function setStats(gen, contribs){
  document.getElementById('pGen').textContent=(gen||0).toLocaleString();
  document.getElementById('pContribs').textContent=(contribs||0).toLocaleString();
  document.getElementById('fGen').textContent=(gen||0).toLocaleString();
  document.getElementById('fContribs').textContent=(contribs||0).toLocaleString();
}

// ── Server fetch ──
async function fetchLive(){
  try{
    const res=await fetch(`/api/display-live?theme=${encodeURIComponent(theme)}`);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data=await res.json();
    const changed = data.generation!==curGen;
    if(data.cellData) decodeCanvas(data.cellData);
    curGen=data.generation||curGen;
    curContribs=data.contributorCount||curContribs;
    setStats(curGen, curContribs);
    render();
    document.getElementById('loading').classList.add('gone');
    if(changed) showPulse();   // a real evolution arrived
  }catch(e){
    // No server data yet — show a living full-spectrum demo field so the
    // display is never blank, and keep trying.
    if(curGen===0){
      for(let i=0;i<WT;i++){
        cells[i]={c:(Math.random()<0.5?'#0a0a14':`hsl(${Math.random()*360|0},60%,${10+Math.random()*35|0}%)`),s:0};
      }
      render();
      document.getElementById('loading').classList.add('gone');
      document.getElementById('pTheme').textContent=theme;
      showPulse();
    }
  }
}

// ── QR generation (qrcodejs) ──
function makeQR(elId, size){
  const el=document.getElementById(elId);
  if(!el||!window.QRCode) return;
  el.innerHTML='';
  new QRCode(el,{text:joinURL,width:size,height:size,
    colorDark:'#06060f',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
}

// ── Pure-art QR: surface periodically, briefly ──
let floatQRcycle=null;
function startFloatQRCycle(){
  const fq=document.getElementById('floatQR');
  function cycle(){
    if(!document.body.classList.contains('framed')){
      fq.classList.add('show');
      setTimeout(()=>fq.classList.remove('show'), 9000); // visible 9s
    }
  }
  cycle();
  floatQRcycle=setInterval(cycle, 28000); // every 28s
}

// ── Frame / pure-art mode toggle ──
function setFramed(on){
  document.body.classList.toggle('framed', on);
  document.getElementById('stage').classList.toggle('framed', on);
  document.getElementById('frame').classList.toggle('show', on);
  const fq=document.getElementById('floatQR');
  if(on) fq.classList.remove('show');
  resize();
}
document.getElementById('btnFrame').addEventListener('click',()=>{
  setFramed(!document.body.classList.contains('framed'));
});

// ── Fullscreen ──
document.getElementById('btnFull').addEventListener('click',()=>{
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
});

// ── Auto-hide controls + cursor after inactivity ──
let idleTimer=null;
function wake(){
  document.getElementById('controls').classList.add('show');
  document.body.classList.remove('hide-cursor');
  clearTimeout(idleTimer);
  idleTimer=setTimeout(()=>{
    document.getElementById('controls').classList.remove('show');
    document.body.classList.add('hide-cursor');
  }, 3500);
}
['mousemove','touchstart','keydown'].forEach(ev=>window.addEventListener(ev,wake));

// ── Boot ──
function boot(){
  document.getElementById('pTheme').textContent=theme;
  document.getElementById('fTheme').textContent=theme;
  resize();
  makeQR('floatQRcode',84);
  makeQR('frameQRcode',168);
  fetchLive();
  setInterval(fetchLive, 60000);            // server refresh
  setInterval(()=>{stepLocal();render();}, 2500); // gentle local life
  startFloatQRCycle();
  if(startFramed) setFramed(true);
  wake();
}
// qrcodejs may load a touch after DOM; boot on window load to be safe
if(document.readyState==='complete') boot();
else window.addEventListener('load', boot);
</script>
</body>
</html>
